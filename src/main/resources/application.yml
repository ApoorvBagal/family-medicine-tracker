# Base configuration. Every environment-specific value comes from an environment variable.
# There are deliberately NO real defaults for credentials here (empty = unset): if DB_URL is
# missing in production, the app fails fast at startup instead of connecting somewhere wrong.
# (Empty rather than no default so tests can supply the connection via Testcontainers.)
spring:
  application:
    name: family-medicine-tracker
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      # Free-tier Postgres allows few connections and the instance has 512 MB RAM.
      maximum-pool-size: 5
      minimum-idle: 0
      # Neon scales to zero; the first connection after idle may take a few seconds.
      connection-timeout: 30000
  flyway:
    enabled: true

server:
  port: ${PORT:8080}            # Render injects PORT
  shutdown: graceful
  forward-headers-strategy: framework   # trust X-Forwarded-* from the hosting proxy (HTTPS detection)

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true
