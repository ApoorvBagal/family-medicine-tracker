# Base configuration. Every environment-specific value comes from an environment variable.
# There are deliberately NO real defaults for credentials here (empty = unset): if DB_URL is
# missing in production, the app fails fast at startup instead of connecting somewhere wrong.
# (Empty rather than no default so tests can supply the connection via Testcontainers.)
spring:
  application:
    name: family-medicine-tracker
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      # Free-tier Postgres allows few connections and the instance has 512 MB RAM.
      maximum-pool-size: 5
      minimum-idle: 0
      # Neon scales to zero; the first connection after idle may take a few seconds.
      connection-timeout: 30000
  flyway:
    enabled: true
  session:
    # One owner on their own phone: stay logged in for 30 days of inactivity. Spring Session reads this,
    # not server.servlet.session.timeout (that one alone gave 30 minutes; AuthIntegrationTest checks it).
    timeout: 30d
    jdbc:
      initialize-schema: never   # tables come from Flyway V2
  mvc:
    problemdetails:
      enabled: true              # RFC 9457 application/problem+json for errors
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true         # index.html, manifest, icons: always revalidate (hashed /assets/** cache 1 year)

server:
  port: ${PORT:8080}            # Render injects PORT
  shutdown: graceful
  forward-headers-strategy: framework   # trust X-Forwarded-* from the hosting proxy (HTTPS detection)
  mime-mappings:
    webmanifest: application/manifest+json   # PWA manifest
  servlet:
    session:
      # Sessions live in Postgres (spring.session above), so restarts and redeploys don't log anyone out.
      cookie:
        http-only: true          # JavaScript can't read the session cookie
        secure: true             # HTTPS only (browsers also allow it on http://localhost)
        same-site: lax
        max-age: 30d             # persistent cookie, so closing the app doesn't log out

app:
  # One-time secret needed to create the owner account (D12). Set on Render; can be removed after setup.
  setup-token: ${SETUP_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    build:
      enabled: true
    env:
      enabled: true   # publishes the info.* properties below

# Shown at /actuator/info. RENDER_GIT_COMMIT is set by Render for each deploy; the deploy workflow
# waits until this matches the commit CI tested. (build.time can't be used: Docker layer caching
# reuses the old jar when only non-code files changed.)
info:
  app:
    commit: ${RENDER_GIT_COMMIT:local}
